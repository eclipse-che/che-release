# This Workflow performs a full release of Che
name: Release - Orchestration
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version that is going to be released. Should be in format 7.y.z'
        required: true
        default: ''
      phases:
        description: '
# Comma-separated phases to perform, e.g. 1,2,3,4
# see README.md / che-release.yaml for declared phases.
# Default: auto (all phases with orchestration:true)
# Omit phases that have successfully run.
'
        required: false
        default: ''
      dry_run:
        description: 'Run in dry-run mode (no workflows will be triggered)'
        required: false
        type: boolean
        default: false
jobs:
  pre_job:
    runs-on: ubuntu-22.04
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # always skip concurrent runs
          concurrent_skipping: 'always'
          # prevent re-running the same release for the same version and phases
          skip_after_successful_duplicate: 'false'
          # "workflow_dispatch" trigger is set for exclusion by default, so we have to clear it
          do_not_skip: '[]'
  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with: 
          credentials: false
      - name: Login to quay.io
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io
      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: 3.13
      - name: Set up environment
        run: |
          python -m pip install --upgrade pip
          pip install yq jq
          python --version
          pip --version
          yq --version
          jq --version

          # install more repos
          sudo apt-get update -y || true
          # install more dependencies
          sudo apt-get -y -q install wget curl bash git hub

          # want git >=2.24, hub >=2
          hub --version # hub reports git version too

          # want >=5
          bash --version
      - name: Release
        run: |
          CHE_VERSION="${{ github.event.inputs.version }}"
          echo "CHE_VERSION=${CHE_VERSION}"
          PHASES="${{ github.event.inputs.phases }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          git config --global user.name "Mykhailo Kuznietsov"
          git config --global user.email "mkuznets@redhat.com"
          export CHE_BOT_GITHUB_TOKEN=${{ secrets.CHE_BOT_GITHUB_TOKEN }}
          export CHE_INCUBATOR_BOT_GITHUB_TOKEN=${{ secrets.CHE_INCUBATOR_BOT_GITHUB_TOKEN }}
          set -e

          # Build command with optional parameters
          CMD="./scripts/make-release.sh -v ${CHE_VERSION}"
          if [ -n "${PHASES}" ]; then
            CMD="${CMD} -p ${PHASES}"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            CMD="${CMD} --dry-run"
          fi

          eval ${CMD}
